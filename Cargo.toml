[package]
name = "agentic-doc"
version = "0.1.2"
edition = "2021"
description = "Keep your project and its documentation in sync — analyse changes, measure coverage, declare relations."
license = "MIT"
repository = "https://github.com/VishwaKumaran/agentic-doc"
readme = "README.md"
keywords = ["documentation", "cli", "coverage", "relations", "python"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
